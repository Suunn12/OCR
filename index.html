<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Simples Tesseract OCR</title>
</head>
<body>

    <h1>Leitor de Imagem com Tesseract OCR</h1>
    <input type="file" id="upload" accept="image/*">
    <p id="status"></p>
    <h3>Texto Extraído:</h3>
    <pre id="resultado"></pre>

    <!-- Script oficial completo do Tesseract.js via CDN -->
    <!--<script src="https://jsdelivr.net"></script>-->
    
    <!-- Versão estável e atualizada via CDNJS (carrega via HTTPS) -->
    <script src="https://cloudflare.com"></script>

    
    <script>
        const input = document.getElementById('upload');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');

        input.addEventListener('change', async (event) => {
            const arquivo = event.target.files[0]; // Correção: acessando o arquivo index [0]
            if (!arquivo) return;

            status.innerText = 'Processando a imagem...';
            resultado.innerText = '';

            try {
                // O Tesseract global estará disponível assim que a página carregar por um servidor
                const { data: { text } } = await Tesseract.recognize(
                    arquivo,
                    'por', // Idioma português
                    { logger: m => console.log(m) }
                );

                status.innerText = 'Concluído!';
                resultado.innerText = text;
            } catch (erro) {
                status.innerText = 'Erro ao processar imagem ou carregar idioma.';
                console.error(erro);
            }
        });
    </script>
</body>
</html>
