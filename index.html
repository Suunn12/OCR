<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR 100% Local e Direto</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button, input { margin: 15px 0; padding: 12px; width: 100%; box-sizing: border-box; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        img { max-width: 100%; max-height: 300px; margin-top: 15px; border-radius: 5px; display: none; }
        #status { font-weight: bold; color: #555; margin: 10px 0; }
        #resultado { text-align: left; background: #eee; padding: 15px; border-radius: 5px; white-space: pre-wrap; display: none; border-left: 5px solid #007bff; }
    </style>
    <!-- Usando uma biblioteca leve que roda em arquivos locais sem travas de segurança -->
    <script src="https://unpkg.com"></script>
</head>
<body>

<div class="container">
    <h2>Leitor de Texto Local (OCR)</h2>
    <p>Abra este arquivo direto no PC ou Celular (Funciona Offline)</p>
    
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    
    <img id="preview" alt="Preview da Imagem">
    
    <div id="status">Aguardando imagem...</div>
    
    <div id="resultado"></div>
</div>

<script>
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const statusDiv = document.getElementById('status');
    const resultadoDiv = document.getElementById('resultado');

    cameraInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Cria o preview na tela
        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
            
            // Dispara o OCR passando o arquivo diretamente
            processarOcrLocal(file);
        };
        reader.readAsDataURL(file);
    });

    async function processarOcrLocal(fileObject) {
        statusDiv.innerText = "Analisando imagem... (Pode levar alguns segundos)";
        resultadoDiv.style.display = 'none';

        try {
            // O pacote javascriptOcr reconhece o texto direto do blob do arquivo
            const jsonResult = await javascriptOcr.getOcrResult({
                image: fileObject
            });

            statusDiv.innerText = "Concluído!";
            
            // Junta as linhas de texto encontradas
            if (jsonResult && jsonResult.text) {
                resultadoDiv.innerText = jsonResult.text;
            } else {
                resultadoDiv.innerText = "Nenhum texto legível foi encontrado.";
            }
            
            resultadoDiv.style.display = 'block';
        } catch (erro) {
            console.error("Erro no OCR:", erro);
            statusDiv.innerText = "Erro ao processar. Certifique-se de que a imagem contém textos claros.";
        }
    }
</script>

</body>
</html>
