<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Leitor de Texto - OCR</title> <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script> <style> body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; box-sizing: border-box; } h1 { text-align: center; } .botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; } .botao { display: inline-block; background: #007bff; color: white; padding: 12px 18px; border-radius: 8px; cursor: pointer; border: none; font-size: 16px; text-align: center; } .botao.camera { background: #28a745; } .botao:hover { opacity: 0.9; } input[type="file"] { display: none; } #preview { display: block; max-width: 100%; max-height: 500px; margin: 20px auto; border-radius: 8px; } #status { margin-top: 15px; font-weight: bold; } textarea { width: 100%; height: 250px; margin-top: 15px; padding: 10px; box-sizing: border-box; font-size: 16px; resize: vertical; } #ler { margin-top: 15px; padding: 12px 20px; font-size: 16px; background: #343a40; color: white; border: none; border-radius: 8px; cursor: pointer; } #ler:disabled { background: #999; cursor: not-allowed; } </style> </head> <body> <h1>📷 Leitor de Texto</h1> <div class="botoes">
<!-- Selecionar uma imagem existente -->
<label class="botao">
  🖼️ Selecionar imagem
  <input
    type="file"
    id="imagem"
    accept="image/*"
  >
</label>

<!-- Abrir câmera -->
<label class="botao camera">
  📷 Tirar foto
  <input
    type="file"
    id="camera"
    accept="image/*"
    capture="environment"
  >
</label>

</div> <img id="preview" alt="Pré-visualização">
<button id="ler">🔍 Ler texto</button>

<p id="status"></p> <textarea id="resultado" placeholder="O texto reconhecido aparecerá aqui..." ></textarea> <script> const inputImagem = document.getElementById("imagem"); const inputCamera = document.getElementById("camera"); const preview = document.getElementById("preview"); const botaoLer = document.getElementById("ler"); const status = document.getElementById("status"); const resultado = document.getElementById("resultado"); let arquivoSelecionado = null; // Quando selecionar uma imagem inputImagem.addEventListener("change", () => { if (inputImagem.files.length === 0) { return; } arquivoSelecionado = inputImagem.files[0]; mostrarImagem(); }); // Quando tirar uma foto inputCamera.addEventListener("change", () => { if (inputCamera.files.length === 0) { return; } arquivoSelecionado = inputCamera.files[0]; mostrarImagem(); }); // Mostra a imagem na tela function mostrarImagem() { preview.src = URL.createObjectURL(arquivoSelecionado); resultado.value = ""; status.textContent = "Imagem pronta para reconhecimento."; } // Executa o OCR botaoLer.addEventListener("click", async () => { if (!arquivoSelecionado) { alert("Selecione uma imagem ou tire uma foto primeiro."); return; } botaoLer.disabled = true; resultado.value = ""; status.textContent = "Iniciando reconhecimento..."; try { const resultadoOCR = await Tesseract.recognize( arquivoSelecionado, "por", { logger: info => { if (info.status === "recognizing text") { const porcentagem = Math.round(info.progress * 100); status.textContent = `Reconhecendo texto: ${porcentagem}%`; } else { status.textContent = info.status; } } } ); resultado.value = resultadoOCR.data.text; status.textContent = "✅ Reconhecimento concluído!"; } catch (erro) { console.error(erro); status.textContent = "❌ Erro ao reconhecer o texto."; } botaoLer.disabled = false; }); </script> </body> </html>
